name: Daily market scan
on:
  schedule:
    - cron: '30 22 * * *' # 05:30 Asia/Bangkok, after both regular sessions close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Refresh US earnings history (up to 20 tickers)
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: node --experimental-strip-types scripts/market-scan/alpha-earnings.mjs
      - name: Persist daily US earnings snapshot
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/alpha-earnings-us.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily US earnings history'
            git push
          fi
      - name: Refresh Thai earnings announcements
        continue-on-error: true
        env:
          SET_INVESTOR_ALERT_API_KEY: ${{ secrets.SET_INVESTOR_ALERT_API_KEY }}
        run: node --experimental-strip-types scripts/market-scan/thai-earnings.mjs
      - name: Persist daily Thai earnings snapshot
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/alpha-earnings-th.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily Thai earnings history'
            git push
          fi
      - name: Scan all directory symbols
        run: npm run scan:market
      - name: Validate coverage and ranking
        run: node scripts/market-scan/check.mjs
      - name: Publish completed snapshots
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/must-watch-us.json data/must-watch-th.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily market screening snapshots'
            git push
          fi
