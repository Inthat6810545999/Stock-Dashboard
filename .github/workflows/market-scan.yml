name: Daily market scan
on:
  schedule:
    - cron: '30 22 * * *' # 05:30 Asia/Bangkok, after both regular sessions close
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-market-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan all directory symbols
        run: npm run scan:market
      - name: Validate coverage and ranking
        run: node scripts/market-scan/check.mjs
      - name: Publish completed snapshots
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/must-watch-us.json data/must-watch-th.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update daily market screening snapshots'
            git push
          fi
