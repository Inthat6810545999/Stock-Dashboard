name: Hourly Thai biggest gainers
on:
  schedule:
    # Retry missed events; successful target slots are persisted to prevent repeat scans.
    - cron: '5,15,25,35,45,55 10-11 * * 1-5'
      timezone: 'Asia/Bangkok'
    - cron: '5,15,25 12 * * 1-5' # Last morning slot: 12:05, then lunch
      timezone: 'Asia/Bangkok'
    - cron: '35,45,55 14 * * 1-5' # Afternoon opening: 14:35 ICT
      timezone: 'Asia/Bangkok'
    - cron: '5,15,25,35,45,55 15,17 * * 1-5'
      timezone: 'Asia/Bangkok'
    - cron: '5,15,25 16 * * 1-5' # Last regular slot: 16:05; final closing slot: 17:05
      timezone: 'Asia/Bangkok'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot-publication
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan the full SET/mai universe with Yahoo Finance
        env:
          GAINER_SCHEDULED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          FORCE_MARKET_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node --experimental-strip-types scripts/market-scan/scan-th-gainers.mjs
      - name: Validate published ranking
        run: node scripts/market-scan/check.mjs
      - name: Publish refreshed ranking
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/must-watch-th.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh hourly Thai biggest gainers'
            git push
          fi
