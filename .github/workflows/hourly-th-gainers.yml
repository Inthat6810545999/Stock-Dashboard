name: Hourly Thai biggest gainers
on:
  workflow_call:
    inputs:
      scheduled:
        type: boolean
        default: false
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot-publication
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan the full SET/mai universe with Yahoo Finance
        env:
          GAINER_SCHEDULED: ${{ inputs.scheduled && 'true' || 'false' }}
          FORCE_MARKET_SCAN: ${{ github.event_name == 'workflow_dispatch' && !inputs.scheduled && 'true' || 'false' }}
        run: node --experimental-strip-types scripts/market-scan/scan-th-gainers.mjs
      - name: Validate published ranking
        run: node scripts/market-scan/check.mjs
      - name: Publish refreshed ranking
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/must-watch-th.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh hourly Thai biggest gainers'
            git push
          fi
