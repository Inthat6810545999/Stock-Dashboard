name: Hourly Thai biggest gainers
on:
  schedule:
    - cron: '17 3-5 * * 1-5' # 10:17, 11:17 and 12:17 ICT
    - cron: '47 7 * * 1-5' # 14:47 ICT, after the lunch break
    - cron: '17 8-10 * * 1-5' # 15:17, 16:17 and final 17:17 ICT scan
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot-publication
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan the full SET/mai universe with Yahoo Finance
        env:
          FORCE_MARKET_SCAN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node --experimental-strip-types scripts/market-scan/scan-th-gainers.mjs
      - name: Validate published ranking
        run: node scripts/market-scan/check.mjs
      - name: Publish refreshed ranking
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/must-watch-th.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh hourly Thai biggest gainers'
            git push
          fi
