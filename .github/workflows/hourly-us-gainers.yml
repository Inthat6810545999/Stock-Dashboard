name: Hourly US biggest gainers
on:
  schedule:
    - cron: '35 9 * * 1-5' # Opening snapshot: 09:35 New York time
      timezone: 'America/New_York'
    - cron: '5 10-16 * * 1-5' # Hourly during trading, plus final closing snapshot at 16:05
      timezone: 'America/New_York'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: market-snapshot-publication
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Scan every US exchange-listed symbol with Yahoo Finance
        run: node --experimental-strip-types scripts/market-scan/scan-us-gainers.mjs
      - name: Validate published ranking
        run: node scripts/market-scan/check.mjs
      - name: Publish refreshed ranking
        run: |
          git config user.name 'market-scan[bot]'
          git config user.email 'market-scan[bot]@users.noreply.github.com'
          git add data/must-watch-us.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh hourly US biggest gainers'
            git push
          fi
